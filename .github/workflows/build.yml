name: Firmware build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install build tools
        run: |
          python -m pip install platformio
          sudo apt-get update
          sudo apt-get install -y g++-multilib

      - name: Regenerate embedded web page
        run: python tools/gzip_webui_settings.py

      - name: Commit generated web page to same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- src/webui_settings.h; then
            echo "Embedded Web UI is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/webui_settings.h
          git commit -m "chore: regenerate embedded photo-only Web UI"
          # A contributor may push another fix while this job is running.
          # Rebase the generated-header commit onto the latest PR head and
          # retry the push instead of failing the whole firmware validation.
          for attempt in 1 2 3; do
            git fetch --no-tags --unshallow origin "${HEAD_BRANCH}" 2>/dev/null || git fetch --no-tags origin "${HEAD_BRANCH}"
            git rebase FETCH_HEAD
            if git push origin "HEAD:${HEAD_BRANCH}"; then
              exit 0
            fi
            echo "PR branch moved during generated Web UI sync (attempt ${attempt}/3); retrying."
          done
          echo "::error::Could not publish generated Web UI after three attempts."
          exit 1

      - name: Check embedded web page
        run: python tools/gzip_webui_settings.py --check

      - name: Check release asset name
        run: python tools/ci_checks.py assets

      - name: Build firmware and optional loader
        run: pio run -e smalltv_settings -e smalltv_loader

      - name: Check theme packages and parsers
        run: |
          python -m pip install -r tools/requirements-theme.txt
          python -m unittest discover -s tests/theme -p 'test_*.py'
          python tools/theme_pack.py examples/themes/pixel-room /tmp/pixel-room.stheme
          cmp examples/themes/pixel-room.stheme /tmp/pixel-room.stheme
          python tools/theme_pack.py examples/themes/terminal-ops /tmp/terminal-ops.stheme
          cmp examples/themes/terminal-ops.stheme /tmp/terminal-ops.stheme
          python tools/theme_pack.py examples/themes/live-status /tmp/live-status.stheme
          cmp examples/themes/live-status.stheme /tmp/live-status.stheme
          sh tests/theme/run.sh
          node tests/theme/test_settings_webui.js
          node tests/theme/test_settings_webui_poll.js

      - name: Check JPEG-only photo profile
        run: python tests/photos/test_photo_only.py

      - name: Check untrusted input parsers
        run: sh tests/fuzz/run.sh

      - name: Check settings storage
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror -g -Isrc -I.pio/libdeps/smalltv_settings/ArduinoJson/src \
            tests/test_storage.cpp -o /tmp/smalltv-storage-tests
          /tmp/smalltv-storage-tests

      - name: Check status responses
        run: sh tests/status/run.sh

      - name: Check request guard
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror -g -Isrc tests/test_webguard.cpp -o /tmp/smalltv-webguard-tests
          /tmp/smalltv-webguard-tests

      - name: Stage firmware files
        if: always()
        run: |
          mkdir -p dist
          copy() { [ -f "$1" ] && cp "$1" "$2" || echo "missing: $1"; }
          copy .pio/build/smalltv_settings/firmware.bin dist/smalltv-settings-firmware.bin
          copy examples/themes/dynamische-uhr.stheme dist/dynamische-uhr.stheme
          copy examples/themes/wetter-bellmerei.stheme dist/wetter-bellmerei.stheme

      - name: Check app-slot space
        run: python tools/ci_checks.py size --envs smalltv_settings,smalltv_loader --min-free 8192

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-settings-firmware
          path: dist/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smalltv-settings-firmware
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
