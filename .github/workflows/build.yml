name: SmallTV web + display-status firmware

on:
  push:
    branches: [clean-image]
    tags: ['clean-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Verify OTA asset name
        run: grep -q '#define UPDATE_ASSET "smalltv-clean-firmware.bin"' src/config.h

      - name: Build web and display-status firmware
        run: pio run -e smalltv_clean

      - name: Compile non-headless theme renderer (not flashed)
        run: pio run -e smalltv_display_check

      - name: Stage firmware
        run: |
          mkdir -p dist
          copy() { test -f "$1" && cp "$1" "$2"; }
          copy .pio/build/smalltv_clean/firmware.bin dist/smalltv-clean-firmware.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-clean-firmware
          path: dist/smalltv-clean-firmware.bin

  release:
    if: startsWith(github.ref, 'refs/tags/clean-v')
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smalltv-clean-firmware
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
