name: SmallTV Stable firmware

on:
  push:
    branches: [main, stable-image]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Ensure support error log is absent
        run: |
          ! grep -q 'data-t="diagnostics"\|id="diagnostics"\|createDiagnosticLog\|downloadDiagnosticLog' src/webui_stable.h
          ! grep -q 'handleCrashClear\|/api/crash/clear' src/WebPortal.cpp

      - name: Verify factory reset clears LittleFS
        run: python tests/factory_reset/check_factory_reset.py

      - name: Verify Open-Meteo theme package
        run: python tools/pack_stheme.py examples/open-meteo/theme.json --check examples/open-meteo/open-meteo.stheme

      - name: Test bounded playlist shuffle
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/playback/test_playback_order.cpp -o /tmp/playback-order-tests
          /tmp/playback-order-tests

      - name: Verify playlist theme selection while validation is deferred
        run: python tests/playback/check_theme_selection.py

      - name: Verify web UI navigation and diagnostics
        run: python tests/webui/check_webui_ui.py

      - name: Test night schedule boundaries
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc tests/night_schedule/test_night_schedule.cpp -o /tmp/night-schedule-tests
          /tmp/night-schedule-tests

      - name: Build firmware, renderer check and first-install loader
        run: pio run -e smalltv_stable -e smalltv_display_check -e smalltv_loader

      - name: Check app image sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          slot = 1044464
          for name in ("smalltv_stable", "smalltv_loader"):
              image = Path(".pio") / "build" / name / "firmware.bin"
              if not image.is_file():
                  raise SystemExit(f"missing firmware image: {image}")
              size = image.stat().st_size
              free = slot - size
              print(f"{name}: {size} bytes; {free} bytes free in 1 MiB OTA slot")
              if free < 8192:
                  raise SystemExit(f"{name} leaves less than 8192 bytes free")
          PY

      - name: Stage stable release files
        run: |
          mkdir -p dist
          cp .pio/build/smalltv_stable/firmware.bin dist/smalltv-stable-firmware.bin
          cp .pio/build/smalltv_loader/firmware.bin dist/smalltv-stable-loader.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-stable-firmware
          path: |
            dist/smalltv-stable-firmware.bin
            dist/smalltv-stable-loader.bin
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smalltv-stable-firmware
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/smalltv-stable-firmware.bin
            dist/smalltv-stable-loader.bin
          generate_release_notes: true
