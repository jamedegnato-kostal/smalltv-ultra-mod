name: Refresh embedded photo-only Web UI

on:
  push:
    branches: [audit/memory-footprint-2026-11]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regenerate compressed Web UI
        run: python tools/gzip_webui_settings.py
      - name: Commit generated Web UI when changed
        run: |
          if git diff --quiet -- src/webui_settings.h; then
            echo "Embedded Web UI is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/webui_settings.h
          git commit -m "chore: regenerate embedded photo-only Web UI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
