name: Create SmallTV Ultra V2 release tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  create-v0-1-9-tag:
    if: contains(github.event.head_commit.message, '[release v0.1.9]')
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable v0.1.9 tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "v0.1.9";
            const ref = `tags/${tag}`;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref
              });
              core.setFailed(`Tag ${tag} already exists; refusing to move it.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            core.notice(`Created ${tag} at ${context.sha}. The firmware release workflow will now build and publish it.`);
