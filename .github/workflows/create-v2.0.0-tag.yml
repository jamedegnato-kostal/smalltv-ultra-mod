name: Create SmallTV Ultra V2 release tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  create-v2-0-0-tag:
    if: contains(github.event.head_commit.message, '[release v2.0.0]')
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable v2.0.0 tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "v2.0.0";
            const config = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "src/config.h",
              ref: context.sha
            });
            const source = Buffer.from(config.data.content, "base64").toString("utf8");
            const version = source.match(/^#\s*define\s+FW_VERSION\s+"([^"]+)"/m);
            if (!version || version[1] !== "2.0.0") {
              core.setFailed(`Refusing to tag ${tag}: src/config.h must contain FW_VERSION "2.0.0" (found ${version ? version[1] : "no version"}).`);
              return;
            }
            const ref = `tags/${tag}`;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref
              });
              core.setFailed(`Tag ${tag} already exists; refusing to move it.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            core.notice(`Created ${tag} at ${context.sha}. The firmware release workflow will now build and publish it.`);
