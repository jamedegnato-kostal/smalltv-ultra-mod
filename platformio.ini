; SmallTV Ultra: web-only firmware. No display, clock, themes or login.
[platformio]
default_envs = smalltv_clean

[env:smalltv_clean]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D SMALLTV_ESP8266
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
  -D ARDUINOJSON_USE_DOUBLE=0
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.0
build_src_filter =
  +<main.cpp>
  +<Settings.cpp>
  +<Net.cpp>
  +<OtaUpdate.cpp>
  +<WebPortal.cpp>
