; SmallTV Ultra: web management, display status and .stheme runtime.
; ESP-12E with 4MB flash: 2MB LittleFS + OTA-capable firmware layout.
[platformio]
default_envs = smalltv_clean

[env:smalltv_clean]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D SMALLTV_ESP8266
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
  -D ARDUINOJSON_USE_DOUBLE=0
  -D WITH_THEME=1
  -D THEME_MAX_LAYERS=32
  -D THEME_MAX_SHOW_RULES=36
  -D HTTP_UPLOAD_BUFLEN=1024
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.0
  bodmer/TJpg_Decoder @ ^1.1.0
  moononournation/GFX Library for Arduino @ 1.6.9
build_src_filter =
  +<main.cpp>
  +<PhotoSlideshow.cpp>
  +<Clock.cpp>
  +<Settings.cpp>
  +<Net.cpp>
  +<OtaUpdate.cpp>
  +<WebPortal.cpp>
  +<theme/ThemeEngine.cpp>
  +<theme/ThemeDisplay.cpp>
  +<theme/ThemePackage.cpp>
  +<theme/ThemeWeb.cpp>
  +<theme/ThemeRuntime.cpp>
  +<theme/ThemeDataFetcher.cpp>
  +<display/DisplayBacklight.cpp>
  +<display/DisplayPanel.cpp>
  +<display/DisplayText.cpp>
  +<display/DisplayStatus.cpp>

; Compile-only validation of the full renderer + display modules.
; This target builds the non-headless theme asset path but is never flashed.
[env:smalltv_display_check]
extends = env:smalltv_clean
build_unflags =
  -D SMALLTV_THEME_HEADLESS=1
