; SmallTV Settings Firmware: ESP8266 firmware with .stheme and photo support.
; Main build: pio run -e smalltv_settings
; Optional first-install helper: pio run -e smalltv_loader

[platformio]
default_envs = smalltv_settings

[common]
build_src_flags =
	-iquote src
	-iquote src/features/theme

lib_deps =
	bblanchon/ArduinoJson @ ^7.4.0
	moononournation/GFX Library for Arduino @ ^1.5.0

[env:smalltv_clean]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
extra_scripts = pre:extra_script.py
monitor_speed = 115200
upload_speed = 921600
build_flags =
	-D SMALLTV_ESP8266
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D ARDUINOJSON_USE_DOUBLE=0
	-D SMALLTV_CLEAN
	-D WITH_THEME=1
	-D WITH_THEME_PLAYLIST=1
	-D WITH_TICKER=0
	-D WITH_USAGE=0
	-D WITH_RADAR=0
	-D WITH_HA=0
	-D WITH_NOTIFY=0
build_src_flags = ${common.build_src_flags}
lib_deps = ${common.lib_deps}

build_src_filter =
	+<*>
	-<loader.cpp>

; Settings-focused build with the photo library enabled.
[env:smalltv_settings]
extends = env:smalltv_clean
build_flags =
	${env:smalltv_clean.build_flags}
	-D SMALLTV_SETTINGS_FIRMWARE
	-D WITH_PHOTOS=1
lib_deps =
	${common.lib_deps}
	bodmer/TJpg_Decoder @ ^1.1.0

[env:smalltv_loader]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
	-D LOADER_BUILD
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
build_src_filter = -<*> +<loader.cpp>
