; SmallTV Ultra: web-only firmware. .stheme package management only; no display renderer.
[platformio]
default_envs = smalltv_clean

[env:smalltv_clean]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D SMALLTV_ESP8266
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
  -D ARDUINOJSON_USE_DOUBLE=0
  -D WITH_THEME=1
  -D SMALLTV_THEME_HEADLESS=1
  -D THEME_MAX_LAYERS=32
  -D THEME_MAX_SHOW_RULES=36
  -D HTTP_UPLOAD_BUFLEN=1024
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.0
build_src_filter =
  +<main.cpp>
  +<Settings.cpp>
  +<Net.cpp>
  +<OtaUpdate.cpp>
  +<WebPortal.cpp>
  +<theme/ThemeEngine.cpp>
  +<theme/ThemeDisplay.cpp>
  +<theme/ThemePackage.cpp>
  +<theme/ThemeWeb.cpp>
